# Publishes imgagent to PyPI.
#
# Setup (one-time, choose ONE):
#   A) Trusted publishing (recommended, no token): on pypi.org create a
#      pending publisher for this project:
#        owner=superz1402 repo=imgagent workflow=publish.yml
#        environment=pypi
#   B) API token: create a PyPI token and store it as the repository secret
#      PYPI_API_TOKEN (GitHub → Settings → Secrets and variables → Actions).
#
# Trigger: push a tag (v0.1.0) or run manually from the Actions tab.

name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # trusted publishing (PyPI OIDC)
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # If using an API token instead of trusted publishing, add:
          # password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
