[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imgagent"
version = "0.1.1"
description = "Universal image discovery, search, listing, download and asset agent — standalone, headless, deterministic, machine-friendly."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "superz1402" },
  { name = "Bilal140202" },
  { name = "ansaribilal14" },
  { name = "hamza140202" },
]
maintainers = [
  { name = "superz1402" },
  { name = "Bilal140202" },
  { name = "ansaribilal14" },
  { name = "hamza140202" },
]
keywords = [
  "images", "image-search", "downloader", "assets", "agent",
  "wikimedia", "openverse", "mcp", "cli", "dataset",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "Pillow>=10.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
avif = ["pillow-avif-plugin>=1.4"]
mcp = ["mcp>=1.2.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "build>=1.2"]

[project.scripts]
imgagent = "imgagent.cli:main"
imgagent-mcp = "imgagent.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Bilal140202/imgagent"
Repository = "https://github.com/Bilal140202/imgagent"
Issues = "https://github.com/Bilal140202/imgagent/issues"
Documentation = "https://github.com/Bilal140202/imgagent/tree/main/docs"
Agent = "https://github.com/Bilal140202/imgagent/blob/main/AGENTS.md"
Landing = "https://superz1402.github.io/imgagent-site/"

[tool.hatch.build.targets.wheel]
packages = ["src/imgagent"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "config.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' -q"
markers = [
  "integration: tests that hit real network sources (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["imgagent"]
